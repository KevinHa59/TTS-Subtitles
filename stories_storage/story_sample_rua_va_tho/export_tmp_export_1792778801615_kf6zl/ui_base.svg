<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="3840" viewBox="0 0 2160 3840">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0c1c"/>
      <stop offset="50%" stop-color="#101229"/>
      <stop offset="100%" stop-color="#080914"/>
    </linearGradient>
    <linearGradient id="overlayGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0c1c" stop-opacity="0.88"/>
      <stop offset="50%" stop-color="#0e1026" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#070812" stop-opacity="0.96"/>
    </linearGradient>
    <radialGradient id="sphere1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#db2777" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphere2" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="playBtn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="subBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181b36" stop-opacity="0.92"/>
      <stop offset="50%" stop-color="#14162e" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#0e1022" stop-opacity="0.98"/>
    </linearGradient>
  </defs>

  <!-- 1. Background -->
  
    <rect width="2160" height="3840" fill="url(#bgGrad)"/>
    <!-- Ambient Glowing Planetary Spheres -->
    <circle cx="560" cy="960" r="320" fill="url(#sphere1)"/>
    <circle cx="1600" cy="1760" r="280" fill="url(#sphere2)"/>
  

  <!-- 2. Disc Outer Rim Shadow -->
  <circle cx="1080" cy="1340" r="530" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="12"/>

  <!-- 3. Top Bar -->
  <g transform="translate(120, 140)">
    <circle cx="72" cy="72" r="72" fill="#1e293b" fill-opacity="0.6"/>
    <path d="M52 62 L72 82 L92 62" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="960" y="96" font-family="Noto Sans" font-size="68" font-weight="600" fill="#ffffff" text-anchor="middle">Now Playing</text>
    <circle cx="1848" cy="72" r="72" fill="#1e293b" fill-opacity="0.6"/>
    <circle cx="1820" cy="72" r="8" fill="#e2e8f0"/>
    <circle cx="1848" cy="72" r="8" fill="#e2e8f0"/>
    <circle cx="1876" cy="72" r="8" fill="#e2e8f0"/>
  </g>

  <!-- 4. Story Title & Heart Favorite -->
  <g transform="translate(120, 2160)">
    <text x="0" y="84" font-family="Noto Sans" font-size="88" font-weight="700" fill="#ffffff">Rùa và Thỏ (Truyện Ngụ Ngôn)</text>
    <text x="0" y="176" font-family="Noto Sans" font-size="56" font-weight="500" fill="#94a3b8">Người kể chuyện</text>
    <circle cx="1840" cy="100" r="72" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="4"/>
    <!-- Heart Icon -->
    <path d="M1840 124 C1840 124 1810 104 1810 80 C1810 64 1822 52 1836 52 C1844 52 1852 58 1854 64 C1856 58 1864 52 1872 52 C1886 52 1898 64 1898 80 C1898 104 1868 124 1868 124 Z" fill="#c084fc"/>
  </g>

  <!-- 5. Timeline Scrubber Background & Total Time Label -->
  <g transform="translate(120, 2440)">
    <rect x="0" y="0" width="1920" height="24" rx="12" fill="#1e293b"/>
    <!-- Total time text on right -->
    <text x="1920" y="84" font-family="Noto Sans" font-size="52" font-weight="500" fill="#94a3b8" text-anchor="end">00:06</text>
  </g>

  <!-- 6. Playback Controls Row -->
  <g transform="translate(120, 2620)">
    <!-- Repeat / 1x -->
    <text x="80" y="130" font-family="Noto Sans" font-size="56" font-weight="700" fill="#ec4899" text-anchor="middle">1x</text>
    <!-- Prev -->
    <path d="M520 80 L570 40 L570 120 Z M500 40 L500 120" fill="#cbd5e1" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
    <!-- Big Center Gradient Button with Pause icon -->
    <circle cx="960" cy="80" r="104" fill="url(#playBtn)"/>
    <rect x="932" y="44" width="18" height="72" rx="6" fill="#ffffff"/>
    <rect x="970" y="44" width="18" height="72" rx="6" fill="#ffffff"/>
    <!-- Next -->
    <path d="M1360 80 L1310 40 L1310 120 Z M1380 40 L1380 120" fill="#cbd5e1" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
    <!-- Shuffle -->
    <path d="M1780 60 L1860 100 M1780 100 L1860 60" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- 7. Subtitle Glassmorphism Card Frame & Header -->
  <g transform="translate(120, 2880)">
    <rect x="0" y="0" width="1920" height="760" rx="56" fill="url(#subBg)" stroke="#a855f7" stroke-width="4" stroke-opacity="0.3"/>
    <!-- Glowing Pink Dot & PHỤ ĐỀ -->
    <circle cx="80" cy="92" r="12" fill="#ec4899"/>
    <text x="120" y="104" font-family="Noto Sans" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="2">PHỤ ĐỀ</text>
    <line x1="40" y1="148" x2="1880" y2="148" stroke="#a855f7" stroke-width="2" stroke-opacity="0.2"/>
  </g>
</svg>